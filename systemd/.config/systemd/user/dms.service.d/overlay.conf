# Run DMS from the overlay built by ~/Documents/projects/dotfiles/scripts/dms-overlay.sh
# (packaged shell + local overrides). If the overlay is not built (an
# overridden DMS file changed upstream, exit 3, or any other failure), DMS
# starts with its stock UI instead.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if "$HOME/Documents/projects/dotfiles/scripts/dms-overlay.sh"; then export DMS_SHELL_DIR="$HOME/.local/share/dms-overlay"; fi; exec /usr/bin/dms run --session'

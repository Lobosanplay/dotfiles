# Run DMS from the overlay built by ~/dotfiles/scripts/dms-overlay.sh
# (packaged shell + local overrides). If building the overlay fails, DMS
# starts with its stock UI instead.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if "$HOME/dotfiles/scripts/dms-overlay.sh"; then export DMS_SHELL_DIR="$HOME/.local/share/dms-overlay"; fi; exec /usr/bin/dms run --session'
